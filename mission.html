<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>Our Mission | IMBROKE</title>
    <link rel="stylesheet" type="text/css" href="./css/style.css" />
    <script src="./js/main.js"></script>
  </head>
  <body>
    <!-- navbar sticky to the top -->
    <header>
      <!-- logo and h2 website name ("IMBROKE") on the left -->
      <div class="brand">
        <a href="./index.html">
          <img class="logo" src="./img/questionmark.png" alt="IMBROKE logo" />
        </a>
        <h2><a href="./index.html">IMBROKE</a></h2>
      </div>

      <!-- hamburger, hidden until phone size, toggles the links below -->
      <span class="mobile-menu" id="mobile-menu" onclick="toggleShow()">&#8801;</span>

      <!-- links in the center, evenly spaced between the logo on the left and the right side div -->
      <nav>
        <ul class="menu" id="menu">
          <li><a href="./sale.html">SALE</a></li>
          <li><a href="./womens.html">Women's</a></li>
          <li><a href="./mens.html">Men's</a></li>
        </ul>

        <img class="icon" src="./img/questionmark.png" alt="Help" />
        <a href="./cart.html">My Cart</a>
        <a href="./account.html">Name Name</a>
      </div>

      <!-- footer links, hidden on desktop, shown at the bottom of the mobile menu -->
      <div class="mobile-links" id="mobile-links">
        <a href="./account.html">Account</a>
        <a href="./careers.html">Careers</a>
        <a href="./disclaimer.html">Disclaimer</a>
        <a href="./contact.html">Contact</a>
        <a href="./mission.html">Our Mission</a>
      </div>
    </header>

    <main>
      <h1>Our Mission</h1>
    </main>

    <!-- footer, same color as the navbar, a grid of col 2 -->
    <footer>
      <!-- left half, logo and website name in a large font -->
      <div class="footer-brand">
        <a href="./index.html">
          <img class="footer-logo" src="./img/questionmark.png" alt="IMBROKE logo" />
        </a>
        <h2><a href="./index.html">IMBROKE</a></h2>
      </div>

      <!-- right half, links split into two columns -->
      <ul class="footer-links">
        <li><a href="./account.html">Account</a></li>
        <li><a href="./careers.html">Careers</a></li>
        <li><a href="./disclaimer.html">Disclaimer</a></li>
        <li><a href="./contact.html">Contact</a></li>
        <li><a href="./mission.html">Our Mission</a></li>
      </ul>
    </footer>

</html>
